<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paseo web proxy shell</title>
    <style>
      html,
      body,
      iframe {
        margin: 0;
        border: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <p id="paseo-shell-status">starting</p>
    <script type="module">
      import { startShellBootstrap } from "../../shell/bootstrap.web.ts";
      import { HARNESS, harnessControlOrigin } from "./harness.ts";
      import { delayLifecycleDelivery } from "./lifecycle-order.ts";

      const deliveryOrder = new URLSearchParams(location.search).get("deliveryOrder");
      if (deliveryOrder !== null) {
        delayLifecycleDelivery(harnessControlOrigin(location), deliveryOrder);
      }

      void startShellBootstrap({
        window,
        controlOrigin: harnessControlOrigin(location),
        workerUrl: HARNESS.workerPath,
        workerScope: HARNESS.workerScope,
        workerType: "module",
        enterPath: HARNESS.enterPath,
        sessionReplyTimeoutMs: HARNESS.sessionReplyTimeoutMs,
      });
    </script>
  </body>
</html>
